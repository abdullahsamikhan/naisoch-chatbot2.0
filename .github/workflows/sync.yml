name: Sync Shopify catalog

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger /admin/sync
        shell: pwsh
        run: |
          Invoke-RestMethod `
            -Uri "${{ vars.RAILWAY_APP_URL }}/admin/sync" `
            -Method POST `
            -Headers @{"X-Admin-Secret"="${{ secrets.ADMIN_SYNC_SECRET }}"}
